server {
    listen 80;

    root  /usr/share/nginx/html;
    index index.html;

    # Reverse proxy: /api/* goes to the API container.
    # "api" is the service name from docker-compose (Docker's internal DNS).
    # Same origin for the browser -> no CORS problems.
    location /api/ {
        proxy_pass         http://api:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Static dashboard
    location / {
        try_files $uri $uri/ =404;
    }
}
